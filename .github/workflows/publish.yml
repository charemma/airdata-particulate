name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build image
        run: nix build .#docker

      - name: Push to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ubuntu runners ship a v1 /etc/containers/registries.conf; the
          # nixpkgs skopeo requires v2. Overwrite with a minimal v2 config.
          sudo tee /etc/containers/registries.conf > /dev/null <<EOF
          unqualified-search-registries = ["docker.io"]
          EOF
          nix run nixpkgs#skopeo -- copy \
            --dest-username "$GHCR_USER" \
            --dest-password "$GHCR_TOKEN" \
            docker-archive:./result \
            docker://ghcr.io/charemma/airdata-particulate:latest
