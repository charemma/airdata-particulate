name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/charemma/particulate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build both arch images
        run: |
          nix build .#dockerAmd64 -o result-amd64
          nix build .#dockerArm64 -o result-arm64

      - name: Push per-arch images and combine into a manifest list
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ubuntu runners ship a v1 /etc/containers/registries.conf; the
          # nixpkgs skopeo requires v2. Overwrite with a minimal v2 config.
          sudo tee /etc/containers/registries.conf > /dev/null <<EOF
          unqualified-search-registries = ["docker.io"]
          EOF

          for arch in amd64 arm64; do
            nix run nixpkgs#skopeo -- copy \
              --dest-username "$GHCR_USER" \
              --dest-password "$GHCR_TOKEN" \
              docker-archive:./result-$arch \
              docker://$IMAGE:$arch
          done

          # Combine per-arch tags into a manifest list at :latest so the
          # scheduler can pull the right variant on any node.
          nix run nixpkgs#manifest-tool -- \
            --username "$GHCR_USER" \
            --password "$GHCR_TOKEN" \
            push from-args \
              --platforms linux/amd64,linux/arm64 \
              --template $IMAGE:ARCH \
              --target $IMAGE:latest
