apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: airdata-particulate
  namespace: monitoring
  labels:
    app: airdata-particulate
    # kube-prometheus-stack's Prometheus resource has serviceMonitorSelector
    # matchLabels: release=monitoring. Without this label the SM is ignored
    # and prometheus never scrapes the exporter.
    release: monitoring
spec:
  selector:
    matchLabels:
      app: airdata-particulate
  endpoints:
    - port: metrics
      interval: 60s
      path: /metrics
