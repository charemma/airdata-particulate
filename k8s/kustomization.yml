apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - deployment.yml
  - service.yml
  - servicemonitor.yml

# Dashboard ConfigMap generated from JSON file so the source of truth stays
# in git as a real JSON file editable in grafana's UI export flow.
# The grafana sidecar in kube-prometheus-stack watches for ConfigMaps with
# the grafana_dashboard=1 label across all namespaces and loads them.
configMapGenerator:
  - name: airdata-particulate-dashboard
    files:
      - particulate.json=dashboard/particulate.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Air Quality
