apiVersion: apps/v1
kind: Deployment
metadata:
  name: airdata-particulate
  namespace: monitoring
  labels:
    app: airdata-particulate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airdata-particulate
  template:
    metadata:
      labels:
        app: airdata-particulate
    spec:
      nodeSelector:
        # sensor-type pins the pod to a specific node (aiagent). The arch
        # selector is a belt-and-suspenders: the image is arm64-only, so
        # misapplying to an amd64 node would fail at container start.
        sensor-type: particulate
        kubernetes.io/arch: arm64
      # aiagent has taint dedicated=home:NoSchedule so only sensor pods land there.
      tolerations:
        - key: dedicated
          operator: Equal
          value: home
          effect: NoSchedule
      # hostNetwork so the exporter binds directly on the node's :8000 and can
      # be scraped from the vps without going through the flannel VXLAN overlay
      # (which currently drops packets on the tailscale transport due to a
      # 1450 vs 1280 MTU mismatch).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: exporter
          image: ghcr.io/charemma/particulate:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8000
          volumeMounts:
            - name: sensor-dev
              mountPath: /dev/ttyUSB0
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: sensor-dev
          hostPath:
            path: /dev/ttyUSB0
            type: CharDevice
